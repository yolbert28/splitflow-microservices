spring.application.name=auth_service

# ─── DataSource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ─── RabbitMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret

# ─── JWT (RS256) ──────────────────────────────────────────────────────────────
# Claves en formato PEM (base64, sin cabeceras BEGIN/END). Se generan con:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 ...
# La aplicacion lanza una excepcion al arrancar si no estan configuradas.
jwt.private-key=${JWT_PRIVATE_KEY_PEM}
jwt.public-key=${JWT_PUBLIC_KEY_PEM}
